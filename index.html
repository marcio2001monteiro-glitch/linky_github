<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heart Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa: #ff4fa3; --rosa-claro: #ffd6ec; --lilas: #c02cff; --noite: #05010d;
    --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--noite); overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }

  /* título */
  .msg {
    position: fixed; left: 0; right: 0; top: max(3.5vh, env(safe-area-inset-top));
    text-align: center; font-family: var(--sans); color: var(--rosa-claro);
    pointer-events: none; padding: 0 16px; z-index: 5;
  }
  .msg h1 {
    margin: 0; font-family: var(--script); font-weight: 700; letter-spacing: .04em;
    font-size: clamp(2rem, 7vw, 3.6rem);
    text-shadow: 0 0 12px var(--rosa), 0 0 32px var(--lilas), 0 0 60px var(--rosa);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .msg p { margin: .2em 0 0; font-size: clamp(.9rem, 2.4vw, 1.15rem); opacity: .8; letter-spacing: .06em; transition: opacity 1.2s; }
  @keyframes pulse { 50% { text-shadow: 0 0 18px #ff7ac0, 0 0 44px #d84bff, 0 0 80px var(--rosa); } }

  .dica {
    position: fixed; left: 0; right: 0; bottom: max(3vh, env(safe-area-inset-bottom)); text-align: center;
    font-family: var(--sans); font-size: .95rem; letter-spacing: .08em; color: var(--rosa-claro);
    text-shadow: 0 0 10px var(--rosa); pointer-events: none; z-index: 5;
    animation: dica 2.8s ease-in-out infinite; transition: opacity .6s;
  }
  .dica.some { opacity: 0 !important; animation: none; }
  @keyframes dica { 50% { opacity: .45; } }

  /* bolhas */
  .bubble {
    position: fixed; left: 0; top: 0; padding: 0; border: 0; background: none;
    border-radius: 50%; cursor: pointer; will-change: transform, opacity;
    -webkit-tap-highlight-color: transparent;
  }
  .bubble .in {
    display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; position: relative;
    background: #2a0a3a;
    box-shadow: 0 0 0 2px rgba(255,190,230,.8), 0 0 16px 3px rgba(255,79,163,.6), 0 0 40px rgba(190,80,255,.45),
                inset 0 -10px 18px rgba(120,20,160,.55);
    animation: brilho 3.2s ease-in-out infinite alternate;
  }
  .bubble .in::after { /* reflexo de vidro */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 30% 24%, rgba(255,255,255,.6), rgba(255,255,255,0) 38%);
  }
  .bubble img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; }
  .bubble .cor { /* coraçãozinho na bolha */
    position: absolute; right: -2px; bottom: -2px; font-size: 1.05rem; line-height: 1; color: #ff7ac0;
    text-shadow: 0 0 8px var(--rosa), 0 0 14px var(--rosa); pointer-events: none; z-index: 2;
  }
  .bubble:hover .in { box-shadow: 0 0 0 3px #fff, 0 0 26px 8px rgba(255,79,163,.85), 0 0 60px rgba(190,80,255,.6), inset 0 -10px 18px rgba(120,20,160,.4); }
  .bubble:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes brilho { to { filter: brightness(1.18); } }

  /* janela da memória */
  .modal {
    position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: rgba(8, 0, 20, .68); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    animation: fade .3s ease;
  }
  .modal[hidden] { display: none; }
  .card {
    position: relative; width: min(100%, 400px); max-height: 100%; overflow-y: auto; box-sizing: border-box;
    padding: 22px 20px 16px; text-align: center; color: var(--rosa-claro); font-family: var(--sans);
    background: linear-gradient(160deg, rgba(60,10,70,.92), rgba(24,4,44,.94));
    border: 1px solid rgba(255,150,210,.4); border-radius: 22px;
    box-shadow: 0 0 40px rgba(255,79,163,.35), 0 0 120px rgba(160,60,255,.3);
    animation: pop .45s cubic-bezier(.2,1.3,.4,1);
  }
  .card.troca { animation: troca .35s ease; }
  .polaroid {
    margin: 0 auto; width: 88%; padding: 10px 10px 8px; box-sizing: border-box; background: #fff6fb; border-radius: 6px;
    transform: rotate(-2deg); box-shadow: 0 8px 28px rgba(0,0,0,.5), 0 0 30px rgba(255,79,163,.35);
  }
  .polaroid img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 3px; background: #2a0a3a; }
  .polaroid figcaption { font-family: var(--script); font-weight: 700; font-size: 1.7rem; color: #a3195b; padding-top: 6px; line-height: 1.1; }
  .texto { font-family: var(--script); font-weight: 500; font-size: clamp(1.3rem, 4.6vw, 1.55rem); line-height: 1.4; margin: 18px 4px 6px; text-wrap: pretty; }
  .ass { font-family: var(--script); font-size: 1.25rem; color: #ff9ccc; margin: 0 0 6px; }
  .nav { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: .85rem; letter-spacing: .1em; opacity: .9; }
  .nav button, .x {
    font: inherit; color: var(--rosa-claro); background: rgba(255,255,255,.08); border: 1px solid rgba(255,150,210,.35);
    border-radius: 50%; width: 40px; height: 40px; font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  .nav button:hover, .x:hover { background: rgba(255,79,163,.35); }
  .nav button:focus-visible, .x:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .x { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; font-size: 1rem; z-index: 3; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) translateY(30px); } }
  @keyframes troca { from { opacity: .2; transform: translateX(14px); } }

  @media (prefers-reduced-motion: reduce) {
    .msg h1, .dica, .bubble .in, .card, .modal { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="msg">
  <h1 id="titulo"></h1>
  <p id="frase"></p>
</div>
<div class="dica" id="dica">tap the bubbles ✦</div>
<div id="bolhas"></div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitulo">
  <div class="card" id="card">
    <button class="x" id="fechar" aria-label="Close">✕</button>
    <figure class="polaroid">
      <img id="mFoto" alt="">
      <figcaption id="mTitulo"></figcaption>
    </figure>
    <p class="texto" id="mMsg"></p>
    <p class="ass" id="mAss"></p>
    <div class="nav">
      <button id="prev" aria-label="Previous">‹</button>
      <span id="mCont"></span>
      <button id="next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
// ✏️ Personalize aqui ---------------------------------------------------------
const NOME = "Hannie";
const ASSINATURA = "With all my love ♥";
const FRASES = [
  "You are my entire galaxy.",
  "Among all the stars, I choose you.",
  "My heart orbits yours.",
  "I love you beyond infinity. ✦",
];
// Each item becomes a bubble. The photos are embedded in the page (see FOTOS above).
const MOMENTOS = [
  { foto: FOTOS[0], titulo: "Hand in Hand",
    msg: "Every road feels shorter when your hand is in mine. I don't need to know where we're going, as long as we walk there together." },
  { foto: FOTOS[1], titulo: "Sleepy Mornings",
    msg: "My favorite place in the whole world is right next to you, warm and half asleep, with nowhere else to be. You turn ordinary nights into the safest home I have ever known." },
  { foto: FOTOS[2], titulo: "Your Hug",
    msg: "When the world gets too loud, I think of your hug and everything goes quiet. You are my peace, my soft place to land." },
  { foto: FOTOS[3], titulo: "Everything for You",
    msg: "Hold me like this forever. There is nothing I wouldn't do for you, and nothing I'd rather do than make you happy." },
  { foto: FOTOS[4], titulo: "Under the Stars",
    msg: "Out of all the stars in the sky, my eyes always find you first. I would rather sit beside you in the dark than watch any sunrise without you." },
  { foto: FOTOS[5], titulo: "A Flower for You",
    msg: "Even through a window, even across the whole world, I would find a way to bring you a flower and see you smile. Loving you is the sweetest thing I know." },
  { foto: FOTOS[6], titulo: "My Partner",
    msg: "You make even the silliest days feel like an adventure. Thank you for being my best friend, my favorite person, and my partner in everything." },
  { foto: FOTOS[7], titulo: "Our Horizon",
    msg: "Whatever tomorrow looks like, I want to watch it with you. Side by side, quiet or loud, we will face every horizon together." },
  { foto: FOTOS[8], titulo: "Always Close",
    msg: "I love you more than words can say, and more than every star in this galaxy. Wherever you go, my heart will keep orbiting yours." },
];
// ------------------------------------------------------------------------------

document.getElementById("titulo").textContent = "I love you, " + NOME;
const frase = document.getElementById("frase");
let fi = 0;
frase.textContent = FRASES[0];
setInterval(() => {
  frase.style.opacity = 0;
  setTimeout(() => { fi = (fi + 1) % FRASES.length; frase.textContent = FRASES[fi]; frase.style.opacity = .8; }, 1200);
}, 5000);

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, S, discScale, cx, cy, bubbleD;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W * 0.6 / 32, H * 0.42 / 30);
  discScale = Math.min(1, (W * 0.48) / (39 * S));
  cx = W / 2; cy = H * 0.45;
  bubbleD = Math.max(58, Math.min(96, S * 5.2));
  for (const b of bubbles) { b.el.style.width = b.el.style.height = bubbleD + "px"; }
}

const rnd = (a, b) => a + Math.random() * (b - a);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

// paleta (rosa, magenta, roxo, branco quente)
const PAL = [[255,79,163],[255,122,192],[216,75,255],[160,90,255],[255,210,235],[255,255,255]];

// ---------- coração (em pé) ----------
const TIPY = 17; // altura da ponta do coração; o disco da galáxia gira exatamente aqui
const NH = 7000;
const H_ = { x: new Float32Array(NH), y: new Float32Array(NH), z: new Float32Array(NH),
             b: new Uint8Array(NH), s: new Float32Array(NH), p: new Float32Array(NH) };
for (let i = 0; i < NH; i++) {
  const t = Math.random() * Math.PI * 2;
  let hx = 16 * Math.pow(Math.sin(t), 3);
  let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  const edge = Math.random() < 0.45;
  const r = edge ? 1 - Math.pow(Math.random(), 3) * 0.08 : Math.sqrt(Math.random());
  hx *= r; hy = (hy + 2.5) * r - 2.5;
  const j = edge ? 0.35 : 0.2;
  H_.x[i] = hx + gauss() * j;
  H_.y[i] = hy + gauss() * j;
  H_.z[i] = gauss() * 5 * Math.sqrt(Math.max(0, 1 - r * r) + 0.15);
  const k = Math.random();
  H_.b[i] = edge ? (k < .5 ? 0 : k < .8 ? 2 : 1) : (k < .4 ? 1 : k < .7 ? 4 : k < .9 ? 0 : 5);
  H_.s[i] = rnd(0.8, 2.1);
  H_.p[i] = Math.random() * 6.283;
}

// ---------- disco da galáxia (horizontal, braços em espiral) ----------
const ND = 9000, ARMS = 3;
const D_ = { r: new Float32Array(ND), a: new Float32Array(ND), y: new Float32Array(ND),
             b: new Uint8Array(ND), s: new Float32Array(ND), p: new Float32Array(ND) };
for (let i = 0; i < ND; i++) {
  const r = 7 + Math.pow(Math.random(), 1.6) * 32;
  const arm = (i % ARMS) * (Math.PI * 2 / ARMS);
  D_.r[i] = r;
  D_.a[i] = arm + r * 0.16 + gauss() * (0.25 + r * 0.012);
  D_.y[i] = gauss() * (0.3 + r * 0.03);
  const k = Math.random(), f = r / 39;
  D_.b[i] = k < 0.06 ? 5 : f < .4 ? (k < .5 ? 4 : 1) : f < .75 ? (k < .5 ? 0 : 2) : (k < .6 ? 3 : 2);
  D_.s[i] = rnd(0.5, 1.6);
  D_.p[i] = Math.random() * 6.283;
}

// ---------- bolhas de memórias ----------
const bubbles = [];
const GRADS = [["#ff4fa3", "#6a2cff"], ["#ff7ac0", "#c02cff"], ["#ff5e8a", "#8a2cff"], ["#e070ff", "#ff4fa3"]];
function placeholder(i) {
  const c = document.createElement("canvas"); c.width = 400; c.height = 500;
  const g = c.getContext("2d"), [a, b] = GRADS[i % GRADS.length];
  const gr = g.createLinearGradient(0, 0, 400, 500); gr.addColorStop(0, a); gr.addColorStop(1, b);
  g.fillStyle = gr; g.fillRect(0, 0, 400, 500);
  g.font = "230px serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(255,255,255,.85)"; g.fillText("♥", 200, 260);
  return c.toDataURL("image/jpeg", .85);
}
const bolhasEl = document.getElementById("bolhas");
MOMENTOS.forEach((m, i) => {
  const el = document.createElement("button");
  el.className = "bubble"; el.type = "button"; el.setAttribute("aria-label", "Open memory: " + m.titulo);
  const inner = document.createElement("span"); inner.className = "in";
  const img = document.createElement("img"); img.alt = ""; img.draggable = false;
  img.onerror = () => { img.onerror = null; img.src = placeholder(i); };
  img.src = m.foto || placeholder(i);
  m.thumb = img;
  inner.appendChild(img);
  const cor = document.createElement("span"); cor.className = "cor"; cor.textContent = "♥";
  el.append(inner, cor);
  bolhasEl.appendChild(el);
  el.addEventListener("click", () => abrir(i, el));
  el.addEventListener("pointerenter", () => hover++);
  el.addEventListener("pointerleave", () => hover = Math.max(0, hover - 1));
  bubbles.push({
    el, i,
    r: 17 + (i % 3) * 6.5 + rnd(-1.5, 1.5),
    a0: i * (Math.PI * 2 / MOMENTOS.length) + rnd(-0.2, 0.2),
    elev: rnd(3, 12), ph: rnd(0, 6.283),
  });
});
let hover = 0;
addEventListener("resize", resize); resize();

// ---------- estrelas de fundo ----------
const stars = Array.from({ length: 220 }, () => ({
  x: Math.random(), y: Math.random(), r: rnd(0.3, 1.4), p: Math.random() * 6.283, v: rnd(1, 3),
}));
let shooting = [];
let hearts = [];

// ---------- interação ----------
let tx = 0, ty = 0, gx = 0, gy = 0, dragging = false, lx = 0, ly = 0, dragYaw = 0, dragPitch = 0;
addEventListener("pointermove", e => {
  tx = (e.clientX / W - 0.5); ty = (e.clientY / H - 0.5);
  if (dragging) { dragYaw += (e.clientX - lx) * 0.006; dragPitch += (e.clientY - ly) * 0.006; lx = e.clientX; ly = e.clientY; }
});
addEventListener("pointerdown", e => {
  if (e.target.closest(".bubble, .modal")) return;
  dragging = true; lx = e.clientX; ly = e.clientY;
  for (let i = 0; i < 6; i++) spawnHeart(e.clientX + rnd(-20, 20), e.clientY + rnd(-10, 10));
});
addEventListener("pointerup", () => dragging = false);
addEventListener("pointercancel", () => dragging = false);
function spawnHeart(x, y) {
  hearts.push({ x, y, vx: rnd(-.4, .4), vy: rnd(-1.6, -.6), life: 1, size: rnd(12, 26), hue: Math.random() < .5 ? "#ff7ac0" : "#e070ff" });
}

// ---------- janela da memória ----------
const modal = document.getElementById("modal"), card = document.getElementById("card");
const mFoto = document.getElementById("mFoto"), mTitulo = document.getElementById("mTitulo"),
      mMsg = document.getElementById("mMsg"), mAss = document.getElementById("mAss"), mCont = document.getElementById("mCont");
let atual = -1, ultimoEl = null;
function mostrar(i, animar) {
  atual = (i + MOMENTOS.length) % MOMENTOS.length;
  const m = MOMENTOS[atual];
  mFoto.src = m.thumb.src; // já é a foto carregada (ou o coração de reserva)
  mTitulo.textContent = m.titulo; mMsg.textContent = m.msg; mAss.textContent = ASSINATURA;
  mCont.textContent = (atual + 1) + " / " + MOMENTOS.length;
  if (animar) { card.classList.remove("troca"); void card.offsetWidth; card.classList.add("troca"); }
}
function abrir(i, el) {
  ultimoEl = el;
  if (el) {
    const r = el.getBoundingClientRect();
    for (let k = 0; k < 10; k++) spawnHeart(r.left + r.width / 2 + rnd(-20, 20), r.top + r.height / 2);
  }
  card.classList.remove("troca");
  mostrar(i, false);
  modal.hidden = false;
  document.getElementById("fechar").focus({ preventScroll: true });
  document.getElementById("dica").classList.add("some");
}
function fechar() {
  modal.hidden = true;
  if (ultimoEl) ultimoEl.focus({ preventScroll: true });
}
document.getElementById("fechar").onclick = fechar;
document.getElementById("prev").onclick = () => mostrar(atual - 1, true);
document.getElementById("next").onclick = () => mostrar(atual + 1, true);
modal.addEventListener("click", e => { if (e.target === modal) fechar(); });
addEventListener("keydown", e => {
  if (modal.hidden) return;
  if (e.key === "Escape") fechar();
  else if (e.key === "ArrowLeft") mostrar(atual - 1, true);
  else if (e.key === "ArrowRight") mostrar(atual + 1, true);
});

// ---------- render ----------
function rot(x, y, z, yaw, pitch) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const x1 = x * c + z * s, z1 = -x * s + z * c;
  const c2 = Math.cos(pitch), s2 = Math.sin(pitch);
  return [x1, y * c2 - z1 * s2, y * s2 + z1 * c2];
}

function drawBuckets(bk) {
  ctx.globalAlpha = 0.85;
  for (let b = 0; b < bk.length; b++) {
    const arr = bk[b];
    ctx.fillStyle = colStr[b];
    for (let i = 0; i < arr.length; i += 3) {
      const s = arr[i + 2];
      ctx.fillRect(arr[i] - s / 2, arr[i + 1] - s / 2, s, s);
    }
  }
}

// arco de anel brilhante; o lado que "vem na nossa direção" fica mais claro (efeito Doppler)
function ringArc(hx, hy, rx, ry, a0, a1, w, gt, alpha) {
  const n = 40, step = (a1 - a0) / n;
  ctx.lineCap = "round"; ctx.lineWidth = w;
  for (let k = 0; k < n; k++) {
    const s0 = a0 + k * step, s1 = s0 + step * 1.2;
    const dop = 0.5 + 0.5 * Math.cos((s0 + s1) / 2 - gt * 1.6);
    ctx.strokeStyle = `rgba(255,${Math.round(140 + 100 * dop)},${Math.round(130 + 100 * dop)},${(alpha * (0.25 + 0.75 * dop)).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(hx, hy, rx, ry, 0, s0, s1); ctx.stroke();
  }
}

// buraco negro na ponta do coração: esfera preta, anel de luz e arcos de lente gravitacional
function drawBlackHole(gPitch, gt) {
  const p = rot(0, TIPY, 0, 0, gPitch);
  const f = FOV / (FOV + p[2]);
  const u = S * f, hx = cx + p[0] * u, hy = cy + p[1] * u;
  const R = 3.6 * u, rx = 5.8 * u, ry = rx * Math.max(0.06, Math.sin(gPitch));
  const PI = Math.PI;

  // brilho ao redor
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(hx, hy, R * 0.9, hx, hy, R * 3.6);
  g.addColorStop(0, "rgba(255,120,190,.55)"); g.addColorStop(0.4, "rgba(190,60,230,.2)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(hx - R * 3.6, hy - R * 3.6, R * 7.2, R * 7.2);

  // metade de trás do anel (fica atrás da esfera)
  ringArc(hx, hy, rx, ry, PI, PI * 2, R * 0.30, gt, 0.28);
  ringArc(hx, hy, rx, ry, PI, PI * 2, R * 0.09, gt, 0.95);

  // a esfera
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(hx, hy, R, 0, PI * 2); ctx.fill();

  ctx.globalCompositeOperation = "lighter";
  // luz do disco curvada pela gravidade: arco por cima e por baixo da esfera
  ringArc(hx, hy, rx, R * 1.45, PI, PI * 2, R * 0.22, gt, 0.3);
  ringArc(hx, hy, rx, R * 1.45, PI, PI * 2, R * 0.07, gt, 0.9);
  ringArc(hx, hy, rx * 0.92, R * 1.28, 0, PI, R * 0.14, gt, 0.25);
  // anel de fótons colado na borda
  ctx.shadowColor = "#ff8ad0"; ctx.shadowBlur = R * 0.6;
  ctx.strokeStyle = "rgba(255,225,240,.9)"; ctx.lineWidth = Math.max(1.2, R * 0.05);
  ctx.beginPath(); ctx.arc(hx, hy, R * 1.03, 0, PI * 2); ctx.stroke();
  ctx.shadowBlur = 0;
  // metade da frente do anel (passa na frente da esfera)
  ringArc(hx, hy, rx, ry, 0, PI, R * 0.30, gt, 0.28);
  ringArc(hx, hy, rx, ry, 0, PI, R * 0.09, gt, 0.95);
}

const FOV = 90, BASE_PITCH = 0.34;
const colStr = PAL.map(c => `rgb(${c[0]},${c[1]},${c[2]})`);
let t0 = performance.now(), last = t0, gt = 0, ts = 1;

function frame(now) {
  const t = (now - t0) / 1000;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // a galáxia desacelera quando você aponta numa bolha ou abre uma memória
  const alvo = !modal.hidden ? 0.25 : hover > 0 ? 0.12 : 1;
  ts += (alvo - ts) * 0.08; gt += dt * ts;

  dragYaw *= dragging ? 1 : 0.95; dragPitch *= dragging ? 1 : 0.95;
  gx += (tx - gx) * 0.05; gy += (ty - gy) * 0.05;
  const gYaw = gx * 0.7 + dragYaw;
  const gPitch = Math.max(-0.1, Math.min(1.1, BASE_PITCH - gy * 0.4 + dragPitch));

  // fundo
  ctx.globalCompositeOperation = "source-over";
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
  bg.addColorStop(0, "#1d0522"); bg.addColorStop(0.5, "#0a0219"); bg.addColorStop(1, "#03000a");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.v + s.p));
    ctx.globalAlpha = a * 0.8; ctx.fillStyle = "#fff";
    ctx.fillRect(s.x * W + gx * s.r * 14, s.y * H + gy * s.r * 14, s.r, s.r);
  }
  if (Math.random() < 0.006) shooting.push({ x: rnd(0.2, 1) * W, y: rnd(0, 0.4) * H, vx: -rnd(7, 12), vy: rnd(3, 6), life: 1 });
  ctx.globalAlpha = 1; ctx.lineCap = "round";
  shooting = shooting.filter(s => s.life > 0);
  for (const s of shooting) {
    ctx.strokeStyle = `rgba(255,220,240,${s.life})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 6, s.y - s.vy * 6); ctx.stroke();
    s.x += s.vx; s.y += s.vy; s.life -= 0.02;
  }

  ctx.globalCompositeOperation = "lighter";

  const beat = 1 + 0.06 * Math.pow(Math.max(0, Math.sin(t * 3)), 6) + 0.02 * Math.sin(t * 1.3);
  const glowR = S * 26 * beat;
  const gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
  gl.addColorStop(0, "rgba(255,70,150,.30)"); gl.addColorStop(0.5, "rgba(170,50,230,.10)"); gl.addColorStop(1, "rgba(0,0,0,0)");
  ctx.globalAlpha = 1; ctx.fillStyle = gl; ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);
  // brilho baixo, na altura do disco
  const gy2 = cy + TIPY * S, gr2 = S * 30;
  const gl2 = ctx.createRadialGradient(cx, gy2, 0, cx, gy2, gr2);
  gl2.addColorStop(0, "rgba(255,120,200,.22)"); gl2.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gl2; ctx.fillRect(cx - gr2, gy2 - gr2, gr2 * 2, gr2 * 2);

  // "far" = coração + metade do disco atrás do buraco negro; "near" = metade da frente
  const far = PAL.map(() => []), near = PAL.map(() => []);
  const hz = TIPY * Math.sin(gPitch); // profundidade do buraco negro
  const sz = S / 12 + 0.6;

  // disco horizontal girando ao redor do eixo vertical que passa pela ponta do coração
  for (let i = 0; i < ND; i++) {
    const r = D_.r[i];
    const a = D_.a[i] + gt * 1.1 / Math.sqrt(r);
    const p = rot(Math.cos(a) * r * discScale, TIPY + D_.y[i], Math.sin(a) * r * discScale, gYaw, gPitch);
    const f = FOV / (FOV + p[2]);
    const tw = 0.7 + 0.3 * Math.sin(t * 2 + D_.p[i]);
    (p[2] > hz ? far : near)[D_.b[i]].push(cx + p[0] * S * f, cy + p[1] * S * f, D_.s[i] * f * tw * sz);
  }
  // coração em pé, balançando de leve
  const sway = Math.sin(t * 0.6) * 0.4;
  for (let i = 0; i < NH; i++) {
    const p0 = rot(H_.x[i] * beat, -H_.y[i] * beat, H_.z[i] * beat, sway, 0);
    const p = rot(p0[0], p0[1], p0[2], gYaw, gPitch);
    const f = FOV / (FOV + p[2]);
    const tw = 0.7 + 0.3 * Math.sin(t * 3 + H_.p[i]);
    far[H_.b[i]].push(cx + p[0] * S * f, cy + p[1] * S * f, H_.s[i] * f * tw * sz);
  }

  drawBuckets(far);                    // coração e o fundo do disco
  drawBlackHole(gPitch, gt);           // esfera na ponta do coração
  ctx.globalCompositeOperation = "lighter";
  drawBuckets(near);                   // parte do disco que passa na frente

  // bolhas: giram junto com o disco, com leve flutuação
  for (const b of bubbles) {
    const a = b.a0 + gt * 1.1 / Math.sqrt(b.r);
    const y = TIPY - b.elev + Math.sin(t * 1.2 + b.ph) * 1.4;
    const p = rot(Math.cos(a) * b.r * discScale, y, Math.sin(a) * b.r * discScale, gYaw, gPitch);
    const f = FOV / (FOV + p[2]);
    const sx = cx + p[0] * S * f, sy = cy + p[1] * S * f;
    const op = Math.min(1, Math.max(0.55, 1 - p[2] * 0.012));
    const st = b.el.style;
    st.transform = `translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0) translate(-50%,-50%) scale(${f.toFixed(3)})`;
    st.zIndex = Math.round(f * 100);
    st.opacity = op.toFixed(2);
  }

  // corações flutuantes
  ctx.globalCompositeOperation = "source-over";
  if (Math.random() < 0.04) spawnHeart(rnd(0.1, 0.9) * W, H + 20);
  hearts = hearts.filter(h => h.life > 0);
  for (const h of hearts) {
    ctx.globalAlpha = Math.max(0, h.life);
    ctx.fillStyle = h.hue; ctx.font = `${h.size}px serif`; ctx.textAlign = "center";
    ctx.shadowColor = h.hue; ctx.shadowBlur = 12;
    ctx.fillText("♥", h.x, h.y);
    h.x += h.vx + Math.sin(h.y / 30) * 0.3; h.y += h.vy; h.life -= 0.004;
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
